name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: yamoto-windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: python -m pip install -r engine/requirements.txt pyinstaller pytest
      - run: npm run build
      - name: Package local Python engine and multimodal dependencies
        run: pyinstaller --onefile --clean --collect-all mediapipe --collect-all cv2 --collect-all numpy --distpath engine/dist --name yamoto-engine engine/yamoto_engine.py
      - name: Smoke-test packaged engine
        shell: pwsh
        run: |
          $result = '{"action":"health"}' | ./engine/dist/yamoto-engine.exe
          $health = $result | ConvertFrom-Json
          if (-not $health.ok -or $health.database -ne 'READY') { throw "Packaged engine health check failed: $result" }
          if ($health.media_features -ne 'READY') { throw "Packaged MediaPipe/OpenCV dependencies are missing: $result" }
      - name: Run Python engine tests
        run: python -m pytest tests -q
      - name: Generate Windows application icon
        shell: pwsh
        run: ./.github/scripts/create-windows-icon.ps1
      - name: Verify Windows icon
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/icons/icon.ico")) { throw "Windows icon was not generated." }
          if ((Get-Item "src-tauri/icons/icon.ico").Length -lt 100) { throw "Windows icon file is invalid or empty." }
      - name: Build installer
        run: npm run tauri -- build --bundles nsis
      - name: Install, launch, and verify packaged application
        shell: pwsh
        run: |
          if (-not [Environment]::Is64BitOperatingSystem) { throw "A 64-bit Windows runner is required." }
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced." }
          $installDir = Join-Path $env:RUNNER_TEMP "YamotoSmokeInstall"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed with exit code $($install.ExitCode)." }
          $app = Get-ChildItem $installDir -Filter "*.exe" -Recurse | Where-Object { $_.Name -notmatch "uninstall|yamoto-engine" } | Select-Object -First 1
          if (-not $app) { throw "Installed desktop application executable was not found." }
          $engine = Get-ChildItem $installDir -Filter "yamoto-engine.exe" -Recurse | Select-Object -First 1
          if (-not $engine) { throw "Bundled yamoto-engine.exe was not found in the installation." }
          $env:YAMOTO_DATA_DIR = Join-Path $env:RUNNER_TEMP "YamotoSmokeData"
          $healthJson = '{"action":"health"}' | & $engine.FullName
          if ($LASTEXITCODE -ne 0) { throw "Installed engine health check failed: $healthJson" }
          $health = $healthJson | ConvertFrom-Json
          if (-not $health.ok -or $health.database -ne "READY" -or $health.media_features -ne "READY") { throw "Installed engine did not report healthy database and media features: $healthJson" }
          $appProcess = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 8
          if (-not (Get-Process -Id $appProcess.Id -ErrorAction SilentlyContinue)) { throw "Desktop application exited during startup smoke test." }
          Stop-Process -Id $appProcess.Id -Force
          $uninstaller = Get-ChildItem $installDir -Filter "*uninstall*.exe" -Recurse | Select-Object -First 1
          if (-not $uninstaller) { $uninstaller = Get-ChildItem $installDir -Filter "unins*.exe" -Recurse | Select-Object -First 1 }
          if (-not $uninstaller) { throw "NSIS uninstaller was not found." }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($uninstall.ExitCode)." }
          Start-Sleep -Seconds 2
          if (Test-Path $app.FullName) { throw "Application executable remains after uninstall." }
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer missing before checksum generation." }
          $hash = Get-FileHash -Path $installer.FullName -Algorithm SHA256
          "$($hash.Hash)  $($installer.Name)" | Set-Content -Path "$($installer.FullName).sha256" -Encoding ascii
          Write-Host "SHA256 $($hash.Hash)"
      - uses: actions/upload-artifact@v4
        with:
          name: yamoto-deception-lab-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
          retention-days: 30
